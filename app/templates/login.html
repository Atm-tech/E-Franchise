<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b4f3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aapoorti">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/app-icon.svg">
  <title>Aapoorti Partner</title>
  <link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body class="login-bg">
    {% include "_loader.html" %}
  <main class="login-layout work-only-login">
    <section class="login-panel">
      <div class="mobile-login-brand"><span class="brand-mark">A</span><b>Aapoorti</b><small>PARTNER APP</small></div>
      <div class="login-card">
        <p class="eyebrow">SECURE ACCESS</p><h2>Sign in</h2><p class="muted">Enter your credentials to open your assigned workspace.</p>
        {% if error %}<div class="alert">{{ error }}</div>{% endif %}
        <form method="post" action="/login" class="form-grid" id="login-form">
          <label>Partner ID<input name="phone" required placeholder="e.g. frn" autofocus autocomplete="username"></label>
          <label>Password<input name="pin" type="password" required placeholder="Your password" autocomplete="current-password"></label>
          <button type="submit">Sign in</button>
        </form>
        <div class="demo-access quick-login"><b>Quick login</b><button type="button" onclick="quickLogin('adm','adm@123')">Admin</button><button type="button" onclick="quickLogin('frn','frn@123')">Franchise</button><button type="button" onclick="quickLogin('pos','pos@123')">POS</button><button type="button" onclick="quickLogin('grd','grd@123')">Guard</button><button type="button" onclick="quickLogin('dlv','dlv@123')">Delivery</button></div>
      </div>
    </section>
  </main>
  <div class="offline-pill" role="status" hidden>Offline mode</div>
  <script src="/static/app-shell.js?v=9" defer></script>
  <script>function quickLogin(user,password){const form=document.getElementById('login-form');form.elements.phone.value=user;form.elements.pin.value=password;form.requestSubmit()}</script>
</body>
</html>
