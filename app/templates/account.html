{% extends "base.html" %}
{% block content %}<section class="card ops-panel account-panel"><h1>Account security</h1><p>{{ user.name }} · {{ user.role }}</p><form method="post" action="/account/password" class="ops-form"><input type="hidden" name="request_key" value="{{ new_request_key() }}"><input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token','') }}"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button>Change password and sign out</button></form></section>{% endblock %}
