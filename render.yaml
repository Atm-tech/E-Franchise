services:
  - type: web
    name: aapoorti-e-franchise-api
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aapoorti-db
          property: connectionString
      - key: E_FRANCHISE_DB_SCHEMA
        value: e_franchise
      - key: SEED_DEMO
        value: "0"
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_LOGIN
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
